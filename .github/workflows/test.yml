name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: calculate-discount
            file: tests/calculate-discount.test.ts
          - name: palindrome
            file: tests/palindrome.test.ts
          - name: sum-even
            file: tests/sum-even.test.ts
    name: test (${{ matrix.suite.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx vitest run ${{ matrix.suite.file }}
